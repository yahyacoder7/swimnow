# =============================================================================
# SwimNow — local development infrastructure
# -----------------------------------------------------------------------------
# Two services only: PostgreSQL (database) + MinIO (object storage for photos
# and videos). Everything the app needs for local dev lives here.
#
#   Start :  docker compose up -d
#   Logs  :  docker compose logs -f
#   Stop  :  docker compose down          (keeps your data)
#   Wipe  :  docker compose down -v       (⚠️ deletes ALL data in the volumes)
#
# Secrets are NOT written here. Values like ${POSTGRES_PASSWORD} are read from
# the ".env" file next to this file. Copy ".env.example" -> ".env" and edit it.
# ".env" is git-ignored, so your secrets never get committed.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 18 — relational database (users, posts, comments, messages, ...)
  # ---------------------------------------------------------------------------
  postgres:
    # Pin the MAJOR version (18) — never use ":latest".
    #   postgres:18-alpine   -> newest 18.x patch on Alpine (small image) ✅
    #   postgres:18.6-alpine -> freezes one exact patch release
    # Alpine is lightweight (good for dev). Use "postgres:18" (Debian) instead
    # if you prefer the glibc-based build.
    image: postgres:18-alpine
    container_name: swimnow-postgres
    # Auto-restart on crash/reboot, but NOT if you stopped it manually
    restart: unless-stopped

    environment:
      # Database superuser name (safe default for local dev)
      POSTGRES_USER: ${POSTGRES_USER}
      # Superuser password — REQUIRED, no default. Compose stops with an error
      # if it is missing, so Postgres can never boot with an empty password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      # Database created automatically on first start
      POSTGRES_DB: ${POSTGRES_DB}
      # Container timezone (UTC keeps timestamps consistent)
      TZ: ${TZ:-UTC}

    ports:
      # host:container — the app connects to localhost:<POSTGRES_PORT>.
      # Change the LEFT number if 5432 is already taken on your machine.
      - "${POSTGRES_PORT}"

    volumes:
      # ⚠️ PostgreSQL 18 BREAKING CHANGE — the data directory moved:
      #     PG 18 mounts the PARENT   : /var/lib/postgresql
      #       (PGDATA inside = /var/lib/postgresql/18/docker)
      #     PG 17 and older mounted   : /var/lib/postgresql/data
      # Using the old "/data" path on 18 makes the container REFUSE to start.
      - postgres-data:/var/lib/postgresql

    healthcheck:
      # Reports "healthy" only once Postgres actually accepts connections
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-swimnow} -d ${POSTGRES_DB:-swimnow}"]
      interval: 10s      # how often to check
      timeout: 5s        # max duration of one check
      retries: 5         # failures before it is marked unhealthy
      start_period: 10s  # grace period on first boot
    # Optional extras (uncomment when needed):
    #   - ./docker/postgres/init:/docker-entrypoint-initdb.d   # *.sql runs once on first start
    #   - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage (profile photos, covers, post media)
  # ---------------------------------------------------------------------------
  minio:
    # quay.io is MinIO's canonical registry. (The Docker Hub "minio/minio"
    # repository is archived; quay.io/minio/minio is the kept-up-to-date one.)
    # Pin a "RELEASE.xxxx" tag once you choose one for reproducibility.
    image: quay.io/minio/minio:latest
    container_name: swimnow-minio
    restart: unless-stopped

    # "server /data"               = serve objects stored in /data
    # "--console-address :9001"    = web admin console on port 9001
    command: server /data --console-address ":9001"

    environment:
      # Root credentials = master access key / secret for the object store.
      # REQUIRED, no defaults — so you never run on minioadmin/minioadmin.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required in .env}

    ports:
      # 9000 = S3 API endpoint (the app uploads/downloads here)
      # 9001 = web console   ->  http://localhost:9001
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

    volumes:
      # Objects (photos/videos) persist across restarts
      - minio-data:/data

    healthcheck:
      # The image bundles "mc" (MinIO client); "ready local" checks the server
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# -----------------------------------------------------------------------------
# Named volumes — Docker manages these on disk. Data survives `down` and is
# only deleted with `docker compose down -v`.
# -----------------------------------------------------------------------------
volumes:
  postgres-data:   # PostgreSQL cluster files
  minio-data:      # uploaded objects (photos, videos)
